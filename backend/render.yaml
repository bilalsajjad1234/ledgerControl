services:
  - type: web
    name: ledgercontrol-backend
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        value: your_super_secret_jwt_key_here_change_in_production
      - key: JWT_EXPIRE
        value: 7d
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production